<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Image Gallery</title>
<style>
body {
font-family: Arial, sans-serif;
margin: 0;
padding: 20px;
background: rgb(240, 244, 248);
}
h1 {
text-align: center;
color: rgb(51, 51, 51);
margin-bottom: 25px;
}
.gallery {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
gap: 20px;
max-width: 1000px;
margin: 0 auto;
}
.card {
background: white;
border-radius: 8px;
overflow: hidden;
box-shadow: 0 2px 6px rgba(0,0,0,0.1);
transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.card:hover {
transform: translateY(-8px);
box-shadow: 0 10px 20px rgba(0,0,0,0.2);
}
.img-box {
width: 100%;
height: 180px;
display: flex;
align-items: center;
justify-content: center;
background: linear-gradient(135deg, rgb(102, 126, 234) 0%, rgb(118, 75, 162) 100%);
color: white;
font-size: 20px;
font-weight: bold;
}
.caption {
padding: 12px;
text-align: center;
font-weight: bold;
color: rgb(74, 85, 104);
}
</style>
</head>
<body>
<h1>Photo Gallery</h1>
<div class="gallery">
<div class="card">
<div class="img-box">Landscape 1</div>
<div class="caption">Mountain Peaks</div>
</div>
<div class="card">
<div class="img-box">Landscape 2</div>
<div class="caption">Ocean Breeze</div>
</div>
<div class="card">
<div class="img-box">Landscape 3</div>
<div class="caption">Forest Trails</div>
</div>
<div class="card">
<div class="img-box">Landscape 4</div>
<div class="caption">Desert Sunset</div>
</div>
</div>
</body>
</html>
